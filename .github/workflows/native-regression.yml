name: Godot Native + Regression

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: native-regression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7.2"
  GODOT_STATUS: "stable"
  GODOT_TEMPLATE_VERSION: "4.7.2.stable"

jobs:
  native-regression:
    name: Scene smoke + native exports
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install CI utilities
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip openjdk-17-jdk
          java -version

      - name: Download Godot editor
        shell: bash
        run: |
          set -euo pipefail
          GODOT_TAG="${GODOT_VERSION}-${GODOT_STATUS}"
          GODOT_ZIP="Godot_v${GODOT_TAG}_linux.x86_64.zip"
          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/${GODOT_ZIP}" \
            -o /tmp/godot.zip
          mkdir -p "$HOME/godot"
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          GODOT_BIN="$HOME/godot/Godot_v${GODOT_TAG}_linux.x86_64"
          chmod +x "$GODOT_BIN"
          sudo ln -sf "$GODOT_BIN" /usr/local/bin/godot
          godot --version

      - name: Install Godot export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_TAG="${GODOT_VERSION}-${GODOT_STATUS}"
          TEMPLATE_FILE="Godot_v${GODOT_TAG}_export_templates.tpz"
          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/${TEMPLATE_FILE}" \
            -o /tmp/export_templates.tpz
          rm -rf /tmp/godot_export_templates
          mkdir -p /tmp/godot_export_templates
          unzip -q /tmp/export_templates.tpz -d /tmp/godot_export_templates
          TEMPLATE_DEST="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          mkdir -p "$TEMPLATE_DEST"
          cp -R /tmp/godot_export_templates/templates/. "$TEMPLATE_DEST/"
          test -f "$TEMPLATE_DEST/linux_release.x86_64"
          test -f "$TEMPLATE_DEST/windows_release_x86_64.exe"
          test -f "$TEMPLATE_DEST/android_debug.apk"

      - name: Headless Godot project smoke check
        shell: bash
        run: |
          set -euo pipefail
          timeout 90 godot --headless --path . --editor --quit

      - name: Canonical scene regression smoke
        shell: bash
        run: |
          set -euo pipefail
          timeout 180 godot --headless --path . --script res://tests/scene_regression_smoke.gd

      - name: Weight inventory regression v0.67
        shell: bash
        run: |
          set -euo pipefail
          timeout 90 godot --headless --path . --script res://tests/weight_inventory_regression_v67.gd

      - name: Export Linux release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/native/linux
          godot --headless --path . --export-release "Linux Desktop" build/native/linux/dont-look-back.x86_64
          test -f build/native/linux/dont-look-back.x86_64
          chmod +x build/native/linux/dont-look-back.x86_64

      - name: Export Windows release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/native/windows
          godot --headless --path . --export-release "Windows Desktop" build/native/windows/dont-look-back.exe
          test -f build/native/windows/dont-look-back.exe

      - name: Prepare Android SDK and debug signing
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME is not configured on the GitHub runner}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35"

          JAVA17_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          echo "JAVA17_HOME=$JAVA17_HOME" >> "$GITHUB_ENV"

          keytool -genkeypair \
            -keystore /tmp/dlb-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Bravo Companion,C=ID" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA17_HOME"
          EOF

      - name: Export Android debug APK
        shell: bash
        env:
          JAVA_HOME: ${{ env.JAVA17_HOME }}
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /tmp/dlb-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          set -euo pipefail
          mkdir -p build/native/android
          godot --headless --path . --export-debug "Android Debug" build/native/android/dont-look-back-debug.apk
          test -f build/native/android/dont-look-back-debug.apk

      - name: Summarize native artifacts
        shell: bash
        run: |
          set -euo pipefail
          find build/native -maxdepth 2 -type f -printf '%p %s bytes\n' | sort

      - name: Upload native smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dont-look-back-native-${{ github.sha }}
          path: build/native
          if-no-files-found: error
          retention-days: 7
