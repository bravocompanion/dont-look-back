name: Godot Web -> Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

env:
  GODOT_VERSION: "4.7.2"
  GODOT_STATUS: "stable"
  GODOT_TEMPLATE_VERSION: "4.7.2.stable"
  CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'dont-look-back' }}

jobs:
  build-and-deploy:
    name: Build Web and deploy Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install CI utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip jq brotli

      - name: Download Godot editor
        shell: bash
        run: |
          set -euo pipefail
          GODOT_TAG="${GODOT_VERSION}-${GODOT_STATUS}"
          GODOT_ZIP="Godot_v${GODOT_TAG}_linux.x86_64.zip"
          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/${GODOT_ZIP}" \
            -o /tmp/godot.zip
          mkdir -p "$HOME/godot"
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          GODOT_BIN="$HOME/godot/Godot_v${GODOT_TAG}_linux.x86_64"
          chmod +x "$GODOT_BIN"
          sudo ln -sf "$GODOT_BIN" /usr/local/bin/godot
          godot --version

      - name: Headless Godot project smoke check
        shell: bash
        run: |
          set -euo pipefail
          timeout 90 godot --headless --path . --editor --quit

      - name: Install Godot Web export templates
        shell: bash
        run: |
          set -euo pipefail
          GODOT_TAG="${GODOT_VERSION}-${GODOT_STATUS}"
          TEMPLATE_FILE="Godot_v${GODOT_TAG}_export_templates.tpz"
          curl -fL --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_TAG}/${TEMPLATE_FILE}" \
            -o /tmp/export_templates.tpz
          rm -rf /tmp/godot_export_templates
          mkdir -p /tmp/godot_export_templates
          unzip -q /tmp/export_templates.tpz -d /tmp/godot_export_templates
          TEMPLATE_DEST="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          mkdir -p "$TEMPLATE_DEST"
          cp -R /tmp/godot_export_templates/templates/. "$TEMPLATE_DEST/"
          test -f "$TEMPLATE_DEST/web_release.zip"

      - name: Export Godot Web release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
          test -f build/web/index.html
          test -f build/web/index.wasm
          test -f build/web/index.pck
          echo "Raw Web build files:"
          find build/web -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Precompress Godot WASM for Cloudflare Pages
        shell: bash
        run: |
          set -euo pipefail
          RAW_WASM="build/web/index.wasm"
          COMPRESSED_WASM="${RAW_WASM}.br"
          RAW_SHA="$(sha256sum "$RAW_WASM" | awk '{print $1}')"

          brotli -q 11 -f -o "$COMPRESSED_WASM" "$RAW_WASM"
          brotli -t "$COMPRESSED_WASM"
          RESTORED_SHA="$(brotli -d -c "$COMPRESSED_WASM" | sha256sum | awk '{print $1}')"
          if [[ "$RAW_SHA" != "$RESTORED_SHA" ]]; then
            echo "Brotli WASM verification failed."
            exit 1
          fi

          rm "$RAW_WASM"
          mv "$COMPRESSED_WASM" "$RAW_WASM"

          cat > build/web/_headers <<'EOF'
          /index.wasm
            Content-Type: application/wasm
            Content-Encoding: br
            Cache-Control: public, max-age=31536000, immutable, no-transform
          EOF

          echo "Deploy-ready Web build files:"
          find build/web -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Upload Web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dont-look-back-web-${{ github.sha }}
          path: build/web
          if-no-files-found: error
          retention-days: 14

      - name: Enforce Cloudflare Pages 25 MiB file limit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sys

          root = Path("build/web")
          limit = 25 * 1024 * 1024
          oversized = []
          for path in root.rglob("*"):
              if path.is_file() and path.stat().st_size > limit:
                  oversized.append((path, path.stat().st_size))

          if oversized:
              print("Cloudflare Pages cannot deploy these assets because each file must be <= 25 MiB:")
              for path, size in oversized:
                  print(f"- {path}: {size / 1024 / 1024:.2f} MiB")
              print("Shrink/split the Web export or move oversized assets to R2 before enabling Pages deploy.")
              sys.exit(1)

          print("Cloudflare Pages asset-size check passed.")
          PY

      - name: Check Cloudflare credentials
        id: cloudflare-auth
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -n "${CLOUDFLARE_API_TOKEN:-}" && -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare deploy skipped: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Actions secrets."
          fi

      - name: Ensure Cloudflare Pages project exists
        if: github.event_name != 'pull_request' && steps.cloudflare-auth.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx --yes wrangler@4 pages project list --json > /tmp/cloudflare-pages-projects.json
          python3 - <<'PY'
          import json
          import os
          import subprocess

          project_name = os.environ["CLOUDFLARE_PAGES_PROJECT"]
          with open("/tmp/cloudflare-pages-projects.json", "r", encoding="utf-8") as handle:
              data = json.load(handle)
          if isinstance(data, dict):
              projects = data.get("result", data.get("projects", []))
          else:
              projects = data
          names = {str(item.get("name", "")) for item in projects if isinstance(item, dict)}
          if project_name in names:
              print(f"Cloudflare Pages project already exists: {project_name}")
          else:
              print(f"Creating Cloudflare Pages project: {project_name}")
              subprocess.run(
                  ["npx", "--yes", "wrangler@4", "pages", "project", "create", project_name, "--production-branch=main"],
                  check=True,
              )
          PY

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' && steps.cloudflare-auth.outputs.ready == 'true' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: >-
            pages deploy build/web
            --project-name=${{ env.CLOUDFLARE_PAGES_PROJECT }}
            --branch=main
            --commit-hash=${{ github.sha }}
